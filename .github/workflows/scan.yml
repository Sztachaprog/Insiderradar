name: Skan danych

# Triggered every ~5 min by an external cron (cron-job.org -> workflow_dispatch API);
# GitHub's own schedule is best-effort and often skipped, so it is only an hourly safety net.
# Every run: crypto via Binance (+ candles, strategy journal, Telegram alerts). Slower tasks run
# when due (ci.py remembers their last run in the database): CoinGecko ranking as often as the
# monthly budget allows, insiders ~15 min, static site ~10 min.
# The database lives xz-compressed on the `data` branch (one force-pushed commit).
# Whales are scanned by scanWhales.yml into their own database (`data-whales` branch);
# this workflow only reads it, for the site and alerts.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Uruchom wszystkie zadania teraz (bez czekania na ich porę)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Warsaw
      FORM4_DB: form4.db
      WHALES_DB: whales.db          # read-only here, written by scanWhales.yml
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # optional: alerts
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Smaller per-run budgets: runs are frequent, so coverage builds up over the day.
      HISTORY_PER_RUN: "2"
      CRYPTO_DETAILS_PER_RUN: "3"     # CoinGecko's free plan: ~10k calls/month
      GT_CALLS_PER_RUN: "5"           # GeckoTerminal calls per run (runs are every 5 min)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pobierz bazę z gałęzi data
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            # The database is stored xz-compressed (~6x smaller); older runs stored it plain.
            if git show origin/data:form4.db.xz > /tmp/form4.db.xz 2>/dev/null; then
              xz -dc /tmp/form4.db.xz > form4.db
            else
              git show origin/data:form4.db > form4.db
            fi
            # Only keep the status file if it exists on the branch (a redirect alone would leave an empty file).
            if git show origin/data:scan_status.json > /tmp/status.json 2>/dev/null; then mv /tmp/status.json scan_status.json; fi
            echo "Baza: $(du -h form4.db | cut -f1)"
          else
            echo "Brak gałęzi data, start od pustej bazy"
          fi

      - name: Pobierz bazę wielorybów (tylko do odczytu)
        run: |
          if git fetch --depth=1 origin data-whales 2>/dev/null; then
            git show origin/data-whales:whales.db.xz | xz -dc > whales.db
            git show origin/data-whales:whales_status.json > whales_status.json 2>/dev/null || true
          fi

      - name: Skan
        run: python ci.py --no-export --only stocks,crypto ${{ inputs.all && '--all' || '' }}

      - name: Zapisz bazę na gałęzi data
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f form4.db ] || exit 0
          mkdir -p /tmp/data && xz -6 -T0 -c form4.db > /tmp/data/form4.db.xz
          cp scan_status.json /tmp/data/ 2>/dev/null || true
          echo "Baza: $(du -h form4.db | cut -f1), skompresowana: $(du -h /tmp/data/form4.db.xz | cut -f1)"
          cd /tmp/data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Dane $(date '+%Y-%m-%d %H:%M %Z')"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: ls
        run: |
          ls -la 
          pwd

      - name: Eksport strony
        id: export
        if: hashFiles('export_due') != ''   # only when the site is due (~every 10 min)
        run: python ci.py --no-scan

      - uses: actions/upload-pages-artifact@v3
        if: steps.export.outcome == 'success'
        with:
          path: site

      - id: deploy
        if: steps.export.outcome == 'success'
        uses: actions/deploy-pages@v4
